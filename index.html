<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>World Cup 2026 Pool</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --blue:#0A0A0C;--navy:#15161C;--orange:#FF6A00;--ink:#0B1330;--mute:#5C6680;--line:#E2E7F1;--green:#15A94E;--red:#E23B3B;--gold:#F4B400;--gold-lt:#FFD64D;
    /* compatibility tokens referenced by inline styles + legacy rules */
    --bg:#0A0A0C;--surface:#FFFFFF;--surface-2:#F6F8FC;--text:#0B1330;--muted:#5C6680;--coral:#E23B3B;--amber:#E8A33D
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--blue);color:#fff;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:0 0 120px}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(90% 46% at 50% -6%, rgba(244,180,0,.13), transparent 60%),
      radial-gradient(120% 70% at 50% 115%, rgba(255,255,255,.035), transparent 55%),
      linear-gradient(180deg,#0C0C0F,#060607)}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  /* labels + headings */
  .eyebrow{font-family:Oswald;font-weight:600;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#AEB6C7}
  h1{font-family:Anton;font-weight:400;line-height:.9;letter-spacing:.005em;text-transform:uppercase;margin:8px 0 6px;color:#fff}
  .sub{color:rgba(255,255,255,.82);font-size:13px;margin:0}
  /* top bar */
  .top{display:flex;justify-content:space-between;align-items:center;padding:16px 0 14px;border-bottom:1px solid rgba(255,255,255,.22);margin-bottom:18px}
  .who{font:600 13px Inter;color:rgba(255,255,255,.8)}.who b{color:#fff}
  .linkbtn{background:none;border:0;color:#fff;font:700 13px Inter;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
  .back{background:none;border:0;color:rgba(255,255,255,.85);font:600 13px Inter;cursor:pointer;padding:8px 0;margin-top:6px}
  /* hero */
  .hero{position:relative;padding:24px 0 4px;text-align:center}
  .hero h1{font-size:56px;text-shadow:0 6px 30px rgba(244,180,0,.18)}
  .hero h1::after{content:"";display:block;height:5px;width:110px;margin:14px auto 0;border-radius:3px;background:linear-gradient(90deg,#16C7C7,#3E7BFF,#A24BFF,#FF4D8D,#FF8A3E)}
  .emblem{display:flex;justify-content:center;margin:18px 0 4px}
  .emblem img{width:176px;max-width:54vw;height:auto;filter:drop-shadow(0 12px 32px rgba(244,180,0,.38))}
  .ribbon{overflow:hidden;margin:14px -14px 4px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
  .rbtrack{display:flex;gap:10px;width:max-content;animation:rb 60s linear infinite}
  .rbflag{width:26px;height:26px;border-radius:50%;overflow:hidden;flex:0 0 auto;box-shadow:0 0 0 1px rgba(255,255,255,.18),0 3px 8px rgba(0,0,0,.5)}
  .rbflag img{width:100%;height:100%;object-fit:cover}
  @keyframes rb{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .lockbar{justify-content:center}
  /* lock bar */
  .lockbar{margin:14px 0 6px;font-size:12px;color:rgba(255,255,255,.85);display:flex;gap:8px;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;background:#37E08B;box-shadow:0 0 8px #37E08B;animation:wcpulse 2.4s ease-in-out infinite}
  .dot.locked{background:#FF8A3E;box-shadow:0 0 8px #FF8A3E;animation:wcpulseR 2.4s ease-in-out infinite}
  /* nav cards */
  .cards{display:flex;flex-direction:column;gap:12px;margin-top:18px}
  .card{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:#101014;border:2px solid var(--orange);border-radius:16px;padding:15px 16px;cursor:pointer;color:#fff;overflow:hidden;transition:transform .06s}
  .card:active{transform:translateY(1px)}
  .card .t{font-family:Anton;font-weight:400;font-size:19px;letter-spacing:.018em;text-transform:uppercase;color:#fff}
  .card .d{font:500 12.5px Inter;color:#9AA1B2;margin-top:3px}
  .card .arrow{font-family:Anton;font-size:22px}
  .cards .card:nth-child(1){border-color:#16C7C7;box-shadow:0 0 22px -6px rgba(22,199,199,.55)}
  .cards .card:nth-child(1) .arrow{color:#16C7C7}
  .cards .card:nth-child(2){border-color:#3E7BFF;box-shadow:0 0 22px -6px rgba(62,123,255,.55)}
  .cards .card:nth-child(2) .arrow{color:#3E7BFF}
  .cards .card:nth-child(3){border-color:#A24BFF;box-shadow:0 0 22px -6px rgba(162,75,255,.55)}
  .cards .card:nth-child(3) .arrow{color:#A24BFF}
  .cards .card:nth-child(4){border-color:#FF4D8D;box-shadow:0 0 22px -6px rgba(255,77,141,.55)}
  .cards .card:nth-child(4) .arrow{color:#FF4D8D}
  .cards .card:nth-child(5){border-color:#FF8A3E;box-shadow:0 0 22px -6px rgba(255,138,62,.55)}
  .cards .card:nth-child(5) .arrow{color:#FF8A3E}
  .cards .card:nth-child(6){border-color:#19B36B;box-shadow:0 0 22px -6px rgba(25,179,107,.55)}
  .cards .card:nth-child(6) .arrow{color:#19B36B}
  /* status pills */
  .tag{font:600 11px Oswald;text-transform:uppercase;letter-spacing:.08em;padding:6px 11px;border-radius:999px;background:var(--orange);color:#fff;white-space:nowrap}
  .tag.gray{background:#E8ECF4;color:#5C6680}.tag.amber{background:#FFE2B0;color:#95590A}.tag.red{background:#FF3B30;color:#fff}
  /* primary buttons */
  .homebtn{display:block;width:100%;margin:18px 0 6px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.45);color:#fff;border-radius:999px;padding:14px;font:700 15px Oswald;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
  .sharebtn{display:block;width:100%;margin:12px 0 0;background:var(--orange);color:#fff;border:0;border-radius:999px;padding:15px;font:700 15px Oswald;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;box-shadow:0 8px 20px -8px rgba(255,106,0,.7)}
  /* scoring doc (sits on blue) */
  .doc h2{font-family:Anton;font-weight:400;text-transform:uppercase;font-size:18px;letter-spacing:.03em;color:#fff;margin:26px 0 10px}
  .doc p{font-size:14.5px;line-height:1.55;color:rgba(255,255,255,.9);margin:0 0 12px}.doc p b,.doc b{color:#fff}
  .rule{display:flex;justify-content:space-between;gap:12px;background:linear-gradient(168deg,#1A1C23,#131419);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:14px 16px;margin-bottom:8px;color:#E8EBF2}
  .rule .lab{font:600 14px Inter;color:#E8EBF2}.rule .lab small{display:block;color:#9AA1B2;font-weight:500;font-size:12px;margin-top:3px}
  .rule .val{font-family:Anton;font-weight:400;font-size:22px;color:var(--gold);white-space:nowrap;text-shadow:0 0 16px rgba(244,180,0,.35)}
  .ex{background:rgba(244,180,0,.07);border:1px dashed rgba(244,180,0,.35);border-radius:12px;padding:12px 14px;font-size:13.5px;color:#E8EBF2;margin-bottom:8px}.ex b{color:var(--gold-lt)}
  table.kt{width:100%;border-collapse:collapse;margin:6px 0 4px;font-size:13.5px;color:#fff}
  table.kt th{text-align:left;color:rgba(255,255,255,.75);font:600 11px Oswald;letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.22)}
  table.kt td{padding:8px;border-bottom:1px solid rgba(255,255,255,.18)}
  table.kt td:last-child,table.kt th:last-child{text-align:right;font-family:Anton}
  /* group header */
  .ghead{font-family:Anton;font-weight:400;font-size:20px;letter-spacing:.08em;color:#fff;margin:26px 4px 10px;display:flex;align-items:center;gap:10px;text-transform:uppercase}
  .ghead::before{content:"";width:9px;height:22px;border-radius:3px;background:linear-gradient(180deg,#16C7C7,#3E7BFF,#A24BFF,#FF4D8D);display:inline-block}
  /* match card */
  .match{background:#fff;border:0;border-radius:16px;padding:0 0 12px;margin-bottom:12px;overflow:hidden;box-shadow:0 8px 22px -10px rgba(8,18,60,.45);color:var(--ink)}
  .meta{display:flex;justify-content:space-between;align-items:center;font:600 11px Oswald;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--navy);padding:9px 14px;margin-bottom:12px}
  .meta .grp{font-family:Anton;color:#FFB200;letter-spacing:.04em;font-size:13px}
  .rowg{display:grid;grid-template-columns:1fr 54px 1fr;gap:8px;align-items:stretch;padding:0 12px}
  .side{appearance:none;border:1.5px solid var(--line);background:#F6F8FC;color:var(--ink);border-radius:12px;padding:11px 8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;transition:border-color .12s,background .12s}
  .side .name{font:600 12.5px/1.15 Inter;text-align:center;color:var(--ink)}
  .side .rk{font:600 10px/1 Inter;color:var(--mute)}
  .side .pts{font:600 11px/1 Inter;color:var(--mute)}.side .pts b{font-family:Anton;font-weight:400;font-size:16px;margin-right:2px;color:var(--ink)}
  .side.upset .pts,.side.upset .pts b{color:var(--orange)}
  .side.sel{background:#FFEFD6;border-color:var(--orange)}
  .side.sel.upset{background:#FFEFD6;border-color:var(--orange)}
  .side.correct{background:#DDF5E6;border-color:var(--green)}
  .side.wrong{background:#FBE0DE;border-color:var(--red)}
  .badge{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 9px/1 Inter;background:#fff;border:1px solid var(--line);color:var(--ink);overflow:hidden;flex:0 0 auto;box-shadow:0 2px 8px rgba(8,18,60,.18)}
  .badge img{width:100%;height:100%;object-fit:cover}
  .side .badge{width:46px;height:46px;font-size:13px}
  .draw{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px solid var(--line);background:#F6F8FC;border-radius:12px;cursor:pointer;color:var(--mute)}
  .draw .x{font-family:Anton;font-size:15px;color:var(--mute)}.draw .pts{font:600 10px/1 Inter}
  .draw.sel{background:#FFEFD6;border-color:var(--orange);color:var(--ink)}
  .draw.correct{background:#DDF5E6;border-color:var(--green)}.draw.wrong{background:#FBE0DE;border-color:var(--red)}
  .res{margin-top:9px;text-align:center;font:600 12px Inter;color:var(--mute);padding:0 12px}
  .res .ft{font-family:Anton;color:var(--ink)}.res .g{color:var(--green)}.res .r{color:var(--red)}
  .odds{display:flex;justify-content:center;gap:14px;margin-top:9px;font:600 10px/1 Oswald;color:var(--mute);padding:0 12px}.odds span b{color:var(--ink)}
  /* sticky bottom CTA */
  .bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,transparent,#060607 32%);padding:18px 14px;display:flex;justify-content:center;z-index:6}
  .bar .inner{width:100%;max-width:560px;display:flex;gap:12px;align-items:center}
  .count{font:600 12px Inter;color:rgba(255,255,255,.85);white-space:nowrap}.count b{color:#fff;font-family:Anton;font-weight:400;font-size:18px}
  button.cta{flex:1;appearance:none;border:0;border-radius:999px;padding:15px;cursor:pointer;font:700 16px Oswald;letter-spacing:.05em;text-transform:uppercase;background:var(--orange);color:#fff;box-shadow:0 8px 20px -8px rgba(255,106,0,.75)}
  button.cta:disabled{background:rgba(255,255,255,.25);color:rgba(255,255,255,.6);cursor:not-allowed;box-shadow:none}
  button.ghost{flex:0 0 auto;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.45);color:#fff;border-radius:999px;padding:15px 18px;font:700 14px Oswald;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
  /* auth */
  .auth{max-width:392px;margin:48px auto;padding:0 18px}
  .auth h1{color:#fff}
  .field{margin-bottom:12px}.field label{display:block;font:600 12px Inter;color:rgba(255,255,255,.85);margin-bottom:6px;letter-spacing:.03em}
  .field input{width:100%;padding:14px;border-radius:12px;border:1.5px solid rgba(255,255,255,.5);background:#fff;color:var(--ink);font:500 15px Inter}
  .field input::placeholder{color:#9AA4BC}
  .toggle{margin-top:14px;font-size:13px;color:rgba(255,255,255,.85);text-align:center}.toggle button{background:none;border:0;color:#FFB200;font:700 13px Inter;cursor:pointer;padding:0}
  .err{background:rgba(226,59,59,.22);border:1px solid #FF6B5B;color:#fff;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}
  .ok{background:#fff;border:0;color:var(--ink);padding:14px;border-radius:12px;font-size:14px;margin-top:16px;box-shadow:0 6px 16px -10px rgba(8,18,60,.4)}
  /* standings */
  .strow{display:flex;align-items:center;gap:10px;background:#fff;border:0;border-left:5px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:6px;box-shadow:0 6px 16px -12px rgba(8,18,60,.5);color:var(--ink)}
  .strow.q{border-left-color:var(--green)}.strow.third{border-left-color:#F0A21E}.strow.out{border-left-color:#CBD3E2;opacity:.75}
  .strow .pos{font:400 13px Anton;color:var(--mute);width:18px}
  .strow .nm{flex:1;font:600 14px Inter;display:flex;align-items:center;gap:8px;color:var(--ink)}.strow .nm small{color:var(--mute);font-weight:500;font-family:Inter}
  .strow .pp{font-family:Anton;font-size:17px;color:var(--orange);margin-right:6px}
  .mv{background:#EEF2FA;border:1px solid var(--line);color:var(--ink);border-radius:8px;width:28px;height:28px;font-size:14px;cursor:pointer}.mv:disabled{opacity:.4;cursor:default}
  .chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);border-radius:999px;padding:8px 13px;margin:4px 5px 4px 0;cursor:pointer;font:600 13px Inter;color:#fff}
  .chip.sel{background:#fff;border-color:#fff;color:var(--ink)}.chip small{font-family:Inter;color:inherit;opacity:.7}
  /* bracket */
  .bk{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 16px;-webkit-overflow-scrolling:touch}
  .bkcol{display:flex;flex-direction:column;justify-content:space-around;gap:8px;min-width:152px;flex:0 0 auto}
  .bkcol.center{justify-content:flex-start;align-items:stretch;min-width:160px}
  .bkcol .ch{font:600 10px Oswald;color:#FFB200;text-transform:uppercase;letter-spacing:.08em;text-align:center;margin-bottom:2px}
  .node{background:#fff;border:0;border-radius:12px;padding:7px 9px;box-shadow:0 6px 16px -12px rgba(8,18,60,.5);color:var(--ink)}
  .node .lab{font:400 10px Anton;color:var(--orange);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
  .nteam{display:flex;align-items:center;gap:6px;padding:6px 7px;border:1px solid var(--line);border-radius:8px;background:#F6F8FC;margin-bottom:4px;font:600 12px Inter;cursor:pointer;color:var(--ink)}
  .nteam:last-child{margin-bottom:0}.nteam .badge{width:18px;height:18px;font-size:8px}
  .nteam .nm2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nteam .s{font:400 10px Anton;color:var(--mute);margin-left:auto}
  .nteam .pb{font:600 10px Inter;color:var(--mute);margin-left:4px}
  .nteam.win{background:#DDF5E6;border-color:var(--green)}.nteam.win .pb{color:var(--green)}
  .nteam.alive{border-color:var(--orange)}
  .nteam.dead{background:#FBE0DE;border-color:var(--red);opacity:.8}.nteam.dead .nm2{text-decoration:line-through;color:var(--red)}
  .nteam.tbd{opacity:.45;cursor:default}
  .champcell{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:linear-gradient(180deg,#FFF6DD,#fff);border:2px solid var(--gold);border-radius:12px;padding:12px 8px;margin-bottom:10px;color:var(--ink);box-shadow:0 8px 22px -10px rgba(244,180,0,.6)}
  .champcell .badge{width:48px;height:48px;font-size:13px;border-color:var(--gold)}
  .champcell .cn{font-family:Anton;font-size:15px;text-transform:uppercase;line-height:1;color:var(--ink)}
  .champcell .cs{font:600 9px Oswald;color:#B07A00;letter-spacing:.1em;text-transform:uppercase}
  /* leaderboard */
  .lb{display:flex;align-items:center;gap:12px;background:linear-gradient(168deg,#1A1C23,#131419);border:1px solid rgba(255,255,255,.09);border-left:4px solid rgba(255,255,255,.14);border-radius:14px;padding:13px 15px;margin-bottom:8px;color:#E8EBF2}
  .lb.clickable{cursor:pointer}.lb.me{box-shadow:0 0 0 2px var(--orange)}
  .lb .rk{font:400 17px Anton;color:#7B8294;width:34px}
  .lb .u{flex:1;font:600 15px Inter;color:#fff}.lb .u small{display:block;color:#9AA1B2;font-weight:500;font-size:11px;margin-top:2px}
  .lb .tot{font-family:Anton;font-size:24px;color:#fff}
  .lb.p1{border-left-color:#F4B400;background:linear-gradient(168deg,rgba(244,180,0,.16),#15161C 62%)}
  .lb.p1 .rk,.lb.p1 .tot{color:#FFD64D;text-shadow:0 0 14px rgba(244,180,0,.45)}
  .lb.p2{border-left-color:#C9D2E3}.lb.p2 .rk,.lb.p2 .tot{color:#DDE4F0}
  .lb.p3{border-left-color:#D08A4E}.lb.p3 .rk,.lb.p3 .tot{color:#E8A968}
  /* live card */
  .lg{background:#fff;border:0;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 8px 22px -10px rgba(8,18,60,.45);color:var(--ink)}
  .lgtop{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:6px}
  .lgteam{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
  .lgteam .badge{width:58px;height:58px;font-size:16px}.lgteam .nm{font:700 14px Inter;text-align:center;color:var(--ink)}.lgteam .rk{font:600 10px Inter;color:var(--mute)}
  .scorebug{display:flex;align-items:center;gap:10px;font-family:Anton;font-size:36px;color:var(--ink)}
  .scorebug.livedot{font:400 12px Anton;color:var(--red);letter-spacing:.12em}
  .scorebug .livedot{font:700 9px Oswald;color:var(--red);letter-spacing:.1em}
  /* picks section on live card */
  .picksec{margin-top:12px}
  .picksec .psrow{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .picksec .psrow:first-child{margin-top:0}
  .picksec .pshead{font:400 13px Anton;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
  .picksec .pscount{font:400 13px Anton;min-width:24px;text-align:center;padding:2px 9px;border-radius:999px;background:#EEF2FA;color:var(--mute)}
  .picksec .psnames{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .picksec .pn{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:#F6F8FC;border:1px solid var(--line);border-radius:8px;padding:4px 9px;color:var(--ink)}
  .picksec .pn b{font:400 11px Anton;color:var(--orange)}
  .picksec .pnone{font-size:13px;color:var(--mute);font-style:italic}
  /* legacy backers grid */
  .backers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .backers.backers3{grid-template-columns:1fr 1fr 1fr}
  .backers .col{font-size:12px}.backers .col h5{margin:0 0 5px;font:600 11px Inter;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
  .backers .col .b{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--line)}
  .backers .col .b .pl{font-family:Anton;color:var(--mute)}
  .wm{position:fixed;right:9px;bottom:7px;font:500 10px Inter;color:rgba(255,255,255,.5);pointer-events:none;z-index:7}
  /* motion */
  @keyframes wcpulse{0%,100%{box-shadow:0 0 0 0 rgba(55,224,139,.55)}50%{box-shadow:0 0 0 6px rgba(55,224,139,0)}}
  @keyframes wcpulseR{0%,100%{box-shadow:0 0 0 0 rgba(255,138,62,.55)}50%{box-shadow:0 0 0 6px rgba(255,138,62,0)}}
  .tag.red{animation:wctag 2s ease-in-out infinite}
  @keyframes wctag{0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,.5)}50%{box-shadow:0 0 10px 0 rgba(255,59,48,.55)}}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}.dot,.dot.locked,.tag.red{animation:none!important}}
</style>
</head>
<body><div id="root"></div><div class="wm">created by pstastny · v20</div>
<script type="text/babel">
const { useState, useEffect } = React;
const API_URL = "https://script.google.com/macros/s/AKfycbxYEbeHPzOfjXtf1xJo2Yara2jv05SwzLZuvAFXF5kpuhpiKQVZu65gIs7ZbcShfzE8/exec";
const GROUP_LOCK_ISO = "2026-06-11T15:00:00-04:00";
const RANK={"Mexico":14,"South Korea":23,"South Africa":41,"Czechia":33,"Canada":27,"Switzerland":18,"Qatar":36,"Bosnia-Herzegovina":43,"Brazil":6,"Morocco":7,"Scotland":31,"Haiti":47,"United States":16,"Paraguay":34,"Australia":24,"Türkiye":20,"Germany":10,"Ecuador":22,"Côte d'Ivoire":29,"Curaçao":46,"Netherlands":8,"Japan":17,"Tunisia":35,"Sweden":32,"Belgium":9,"Iran":19,"Egypt":26,"New Zealand":48,"Spain":2,"Uruguay":12,"Saudi Arabia":39,"Cape Verde":44,"France":3,"Senegal":15,"Norway":28,"Iraq":40,"Argentina":1,"Austria":21,"Algeria":25,"Jordan":42,"Portugal":5,"Colombia":13,"Uzbekistan":38,"DR Congo":37,"England":4,"Croatia":11,"Panama":30,"Ghana":45};
const GROUPS={A:["Mexico","South Korea","South Africa","Czechia"],B:["Canada","Switzerland","Qatar","Bosnia-Herzegovina"],C:["Brazil","Morocco","Scotland","Haiti"],D:["United States","Paraguay","Australia","Türkiye"],E:["Germany","Ecuador","Côte d'Ivoire","Curaçao"],F:["Netherlands","Japan","Tunisia","Sweden"],G:["Belgium","Iran","Egypt","New Zealand"],H:["Spain","Uruguay","Saudi Arabia","Cape Verde"],I:["France","Senegal","Norway","Iraq"],J:["Argentina","Austria","Algeria","Jordan"],K:["Portugal","Colombia","Uzbekistan","DR Congo"],L:["England","Croatia","Panama","Ghana"]};
let CREST={};
(function(){var F={"Mexico":"mx","South Korea":"kr","South Africa":"za","Czechia":"cz","Canada":"ca","Switzerland":"ch","Qatar":"qa","Bosnia-Herzegovina":"ba","Brazil":"br","Morocco":"ma","Scotland":"gb-sct","Haiti":"ht","United States":"us","Paraguay":"py","Australia":"au","Türkiye":"tr","Germany":"de","Ecuador":"ec","Côte d'Ivoire":"ci","Curaçao":"cw","Netherlands":"nl","Japan":"jp","Tunisia":"tn","Sweden":"se","Belgium":"be","Iran":"ir","Egypt":"eg","New Zealand":"nz","Spain":"es","Uruguay":"uy","Saudi Arabia":"sa","Cape Verde":"cv","France":"fr","Senegal":"sn","Norway":"no","Iraq":"iq","Argentina":"ar","Austria":"at","Algeria":"dz","Jordan":"jo","Portugal":"pt","Colombia":"co","Uzbekistan":"uz","DR Congo":"cd","England":"gb-eng","Croatia":"hr","Panama":"pa","Ghana":"gh"};for(var k in F)CREST[k]="https://flagcdn.com/w160/"+F[k]+".png";})();
let TITLE={}; // team -> title-win strength (implied prob), loaded from the TitleOdds tab
function buildFixtures(){const pairs=[[0,1],[2,3],[0,2],[3,1],[0,3],[1,2]];const out=[];
  Object.keys(GROUPS).forEach(g=>{const t=GROUPS[g];pairs.forEach((p,i)=>out.push({id:g+(i+1),group:g,teamA:t[p[0]],teamB:t[p[1]],seedA:RANK[t[p[0]]],seedB:RANK[t[p[1]]],dateTimeISO:"",city:"",country:""}));});return out;}
// Display scoring mirrors the backend (Code.gs). Bonus from the win-probability gap.
const BONUS_SCALE=20,BONUS_CAP=15,BONUS_MIN_GAP=0.05,TITLE_MIN_PROB=0.003,DRAW_SCALE=12,DRAW_CAP=8;
function oddsBonus(yourProb,oppProb){yourProb=Number(yourProb);oppProb=Number(oppProb);if(!(yourProb>=0)||!(oppProb>=0))return 0;const gap=oppProb-yourProb;if(gap<BONUS_MIN_GAP)return 0;return Math.max(0,Math.min(BONUS_CAP,Math.round(gap*BONUS_SCALE)));}
function drawBonus(probA,probB){probA=Number(probA);probB=Number(probB);if(!(probA>=0)||!(probB>=0))return 0;return Math.max(0,Math.min(DRAW_CAP,Math.round(Math.abs(probA-probB)*DRAW_SCALE)));}
// pts if the chosen side wins: 1 + bonus. Draw = 1 + draw bonus. probA/probB are 0..1 win odds for this fixture.
function potential(pick,probA,probB){if(pick==="D")return 1+drawBonus(probA,probB);const y=pick==="A"?probA:probB,o=pick==="A"?probB:probA;return 1+oddsBonus(y,o);}
const KOM={R32:1,R16:1.5,QF:2,SF:2.5,FINAL:3};
function matchProbFromTitle(x,y){const sx=Math.max(Number(x)||0,TITLE_MIN_PROB),sy=Math.max(Number(y)||0,TITLE_MIN_PROB);return sx/(sx+sy);}
function koPotential(round,pickedTitle,oppTitle){const y=matchProbFromTitle(pickedTitle,oppTitle),o=1-y;return Math.round((1+oddsBonus(y,o))*KOM[round]);}
function initials(n){return n?n.replace(/&|\.|-/g," ").split(/\s+/).map(w=>w[0]).join("").slice(0,3).toUpperCase():"";}
function fmt(iso){if(!iso)return "Time & venue load live";const d=new Date(iso);return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})+" · "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});}
function byTime(a,b){if(a.dateTimeISO&&b.dateTimeISO)return new Date(a.dateTimeISO)-new Date(b.dateTimeISO);if(a.dateTimeISO)return -1;if(b.dateTimeISO)return 1;return a.id.localeCompare(b.id);}
// Stable signature of a picks object — order-independent, so we can tell if standings were built from the current picks.
function picksSig(p){return Object.keys(p||{}).sort().map(k=>k+":"+p[k]).join("|");}
async function postJSON(b){const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)});return r.json();}
const KO_SOON_ISO = "2026-06-27T09:00:00-06:00"; // June 27, 9:00 AM Mountain — knockout card shows "Coming soon"
const KO_LIVE_ISO = "2026-06-27T23:59:00-06:00"; // June 27, 11:59 PM Mountain — knockout goes live
function locked(){return new Date()>=new Date(GROUP_LOCK_ISO);}
// Navigation phase: 1 = pre group lock, 2 = group stage underway, 3 = knockout soon, 4 = knockout live
function navPhase(){const now=new Date();
  if(now>=new Date(KO_LIVE_ISO))return 4;
  if(now>=new Date(KO_SOON_ISO))return 3;
  if(now>=new Date(GROUP_LOCK_ISO))return 2;
  return 1;}
function isLive(f){if(f.status==="LIVE")return true;if(f.status==="FINISHED")return false;if(!f.dateTimeISO)return false;const k=new Date(f.dateTimeISO),now=new Date();return now>=k&&now<=new Date(k.getTime()+2.25*3600*1000);}
function eliminatedSet(fixtures){const s=new Set();fixtures.forEach(f=>{if(f.round&&f.round!=="GROUP"&&f.result){const loser=f.result==="A"?f.teamB:f.result==="B"?f.teamA:null;if(loser)s.add(loser);}});return s;}
function actualR32(fixtures){const s=new Set();fixtures.forEach(f=>{if(f.round==="R32"){if(f.teamA)s.add(f.teamA);if(f.teamB)s.add(f.teamB);}});return s;}
function ranksWithTies(rows){let last=null,place=0;const counts={};rows.forEach(r=>counts[r.total]=(counts[r.total]||0)+1);
  return rows.map((r,i)=>{if(r.total!==last){place=i+1;last=r.total;}return{...r,place:(counts[r.total]>1?"T":"")+place};});}
function Crest({team,cls}){const u=CREST[team];return <span className={"badge "+(cls||"")}>{u?<img src={u} alt=""/>:initials(team)}</span>;}
function standings(teams,fixtures,picks){const pts={};teams.forEach(t=>pts[t]=0);
  fixtures.filter(f=>teams.includes(f.teamA)).forEach(f=>{const p=picks[f.id];if(!p)return;
    if(p==="A")pts[f.teamA]+=3;else if(p==="B")pts[f.teamB]+=3;else{pts[f.teamA]+=1;pts[f.teamB]+=1;}});
  return{order:teams.slice().sort((a,b)=>pts[b]-pts[a]||RANK[a]-RANK[b]),pts};}
const THIRD_SLOTS=[{w:'E',e:['A','B','C','D','F']},{w:'I',e:['C','D','F','G','H']},{w:'A',e:['C','E','F','H','I']},{w:'L',e:['E','H','I','J','K']},{w:'G',e:['A','E','H','I','J']},{w:'D',e:['B','E','F','I','J']},{w:'B',e:['E','F','G','I','J']},{w:'K',e:['D','E','I','J','L']}];
function matchThirds(chosen){const used=Array(8).fill(false),res={};function bt(i){if(i===chosen.length)return true;for(let s=0;s<8;s++){if(!used[s]&&THIRD_SLOTS[s].e.includes(chosen[i].group)){used[s]=true;res[THIRD_SLOTS[s].w]=chosen[i];if(bt(i+1))return true;used[s]=false;delete res[THIRD_SLOTS[s].w];}}return false;}return bt(0)?res:null;}
const FIXED_R32=[["RU-A","RU-B"],["W-C","RU-F"],["W-F","RU-C"],["RU-E","RU-I"],["W-H","RU-J"],["RU-K","RU-L"],["RU-D","RU-G"],["W-J","RU-H"]];
const ROUND_SEQ=[["R32",16],["R16",8],["QF",4],["SF",2],["FINAL",1]];

/* ===== Bracket: linear paired layout (R32 pairs → R16 → QF → SF → Final) ===== */
function Bracket({field,pk,onPick,colorFn,interactive}){
  const ROUNDS=[["R32",16],["R16",8],["QF",4],["SF",2],["FINAL",1]];
  function teamsForRound(ri){
    if(ri===0)return field;
    const prev=ROUNDS[ri-1][0];const pt=teamsForRound(ri-1);const out=[];
    for(let m=0;m<pt.length/2;m++){const w=(pk[prev]||{})[m];out.push(w?field.find(f=>f&&f.team===w):null);}
    return out;}
  function NTeam({x,opp,round,m}){
    if(!x)return <div className="nteam tbd"><span className="nm2">TBD</span></div>;
    const sel=(pk[round]||{})[m]===x.team;
    const up=opp&&(matchProbFromTitle(TITLE[opp.team],TITLE[x.team])-matchProbFromTitle(TITLE[x.team],TITLE[opp.team]))>=BONUS_MIN_GAP;
    const pts=opp?koPotential(round,TITLE[x.team],TITLE[opp.team]):0;
    const c=colorFn?colorFn(x.team):"";
    let cl=sel?" win":""; if(c)cl=" "+c;
    return <div className={"nteam"+cl} onClick={()=>interactive&&opp&&onPick(round,m,x.team)}>
      <Crest team={x.team}/><span className="nm2">{x.team}</span><span className="s">#{x.seed}</span>
      {opp&&interactive&&<span className="pb">+{pts}{up?"↑":""}</span>}</div>;}
  // build columns: pair each R32 match with its downstream rounds converging inward
  // Layout: [R32 left 8] [R16 left 4] [QF left 2] [SF left 1] [FINAL] [SF right 1] [QF right 2] [R16 right 4] [R32 right 8]
  const r32=teamsForRound(0);const r16=teamsForRound(1);const qf=teamsForRound(2);const sf=teamsForRound(3);const fin=teamsForRound(4);
  const champ=(pk.FINAL||{})[0];
  function mkNode(round,m,teams){
    const a=teams[m*2],b=teams[m*2+1];
    return <div key={round+m} className="node"><div className="lab">{round} · {m+1}</div>
      <NTeam x={a} opp={b} round={round} m={m}/><NTeam x={b} opp={a} round={round} m={m}/></div>;}
  return (<div className="bk">
    <div className="bkcol"><div className="ch">R32</div>{[0,1,2,3,4,5,6,7].map(m=>mkNode("R32",m,r32))}</div>
    <div className="bkcol"><div className="ch">R16</div>{[0,1,2,3].map(m=>mkNode("R16",m,r16))}</div>
    <div className="bkcol"><div className="ch">QF</div>{[0,1].map(m=>mkNode("QF",m,qf))}</div>
    <div className="bkcol"><div className="ch">SF</div>{[0].map(m=>mkNode("SF",m,sf))}
      <div className="champcell"><Crest team={champ||""}/><div className="cs">Champion</div><div className="cn">{champ||"TBD"}</div></div>
      {mkNode("FINAL",0,fin)}</div>
    <div className="bkcol"><div className="ch">SF</div>{[1].map(m=>mkNode("SF",m,sf))}</div>
    <div className="bkcol"><div className="ch">QF</div>{[2,3].map(m=>mkNode("QF",m,qf))}</div>
    <div className="bkcol"><div className="ch">R16</div>{[4,5,6,7].map(m=>mkNode("R16",m,r16))}</div>
    <div className="bkcol"><div className="ch">R32</div>{[8,9,10,11,12,13,14,15].map(m=>mkNode("R32",m,r32))}</div>
  </div>);}

/* Predicted R32 — simple two-column matchup list, entirely separate from the live knockout Bracket */
function PredBracket({games,realSet}){
  const has=realSet&&realSet.size>0;
  const cl=t=>!has?"":(realSet.has(t)?" alive":" dead");
  const half=(list,offset)=>list.map(([a,b],i)=>(
    <div key={i} className="node"><div className="lab">R32 · {offset+i+1}</div>
      <div className={"nteam"+cl(a)}><Crest team={a}/><span className="nm2">{a}</span><span className="s">#{RANK[a]}</span></div>
      <div className={"nteam"+cl(b)}><Crest team={b}/><span className="nm2">{b}</span><span className="s">#{RANK[b]}</span></div>
    </div>));
  return (<div className="bk">
    <div className="bkcol"><div className="ch">Left half · 1–8</div>{half(games.slice(0,8),0)}</div>
    <div className="bkcol"><div className="ch">Right half · 9–16</div>{half(games.slice(8),8)}</div>
  </div>);
}


/* Auth */
function Auth({onAuth}){
  const remembered=(typeof localStorage!=="undefined")?localStorage.getItem("wc_user"):null;
  const [mode,setMode]=useState(remembered?"returning":"login");
  const [u,setU]=useState(remembered||"");const [p,setP]=useState("");const [err,setErr]=useState("");const [busy,setBusy]=useState(false);
  async function go(signup){setErr("");const name=(mode==="returning"?remembered:u).trim();
    if(!name||!p){setErr("Enter your "+(mode==="returning"?"passcode.":"username and passcode."));return;}
    setBusy(true);try{const res=await postJSON({action:signup?"signup":"login",username:name,passcode:p});
      if(res.error){setErr(res.error);}else{if(typeof localStorage!=="undefined")localStorage.setItem("wc_user",res.username);onAuth(res.username);}
    }catch(e){setErr("Network error — try again.");}setBusy(false);}
  return (<div className="auth"><div className="eyebrow">World Cup 2026 Pool</div>
    <h1 style={{fontSize:34,margin:"8px 0 18px"}}>{mode==="returning"?"Welcome back":mode==="signup"?"Create account":"Sign in"}</h1>
    {err&&<div className="err">{err}</div>}
    {mode==="returning"?(<div className="field"><label>Passcode for <b style={{color:"var(--text)"}}>{remembered}</b></label>
      <input type="password" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go(false)} autoFocus /></div>
    ):(<><div className="field"><label>Username</label><input value={u} onChange={e=>setU(e.target.value)} autoCapitalize="none" /></div>
      <div className="field"><label>Passcode</label><input type="password" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go(mode==="signup")} /></div></>)}
    <button className="cta" style={{width:"100%"}} disabled={busy} onClick={()=>go(mode==="signup")}>{busy?"…":mode==="returning"?"Continue":mode==="signup"?"Create account":"Sign in"}</button>
    <div className="toggle">{mode==="returning"&&<button onClick={()=>{setMode("login");setU("");setErr("");}}>Not {remembered}? Switch user</button>}
      {mode==="login"&&<span>New here? <button onClick={()=>{setMode("signup");setErr("");}}>Create an account</button></span>}
      {mode==="signup"&&<span>Already in? <button onClick={()=>{setMode("login");setErr("");}}>Sign in</button></span>}</div></div>);
}

/* Home */
function Home({user,go,onSignOut,picksCount,standingsDone,standingsStale,koStatus,koOpen,anyLive,phase}){

      <div className="lockbar"><span className={"dot"+(L?" locked":"")}></span>{L?"Group picks are locked — tournament underway.":"Group picks lock at the first kickoff, June 11."}</div></div>

/* How scoring */
function HowScoring({back}){
  return (<div className="wrap doc"><button className="back" onClick={back}>← Back</button>
    <div className="eyebrow">The rules</div><h1 style={{fontSize:32}}>How scoring works</h1>
    <p>The short version: <b>a correct pick is worth 1 point. The bigger the underdog you call, the bigger the bonus — up to +15. In the knockouts, every round multiplies the stakes.</b></p>
    <p>Bonuses are based on <b>sportsbook win odds</b>, shown on every game. Backing a heavy favorite that wins is still smart — it just earns the flat point. Calling a genuine upset is where the points are.</p>
    <p><b>Draws count too:</b> calling a draw earns a bonus when one team was heavily favored and got held — the more lopsided the matchup, the bigger the draw bonus (up to +8). It's always worth less than calling the underdog to win outright.</p>
    <h2>Group stage — per game</h2>
    <div className="rule"><div className="lab">Correct favorite win</div><div className="val">1</div></div>
    <div className="rule"><div className="lab">Correct draw<small>bigger bonus when a heavy favorite gets held</small></div><div className="val">1 + bonus</div></div>
    <div className="rule"><div className="lab">Correct underdog win<small>1 point + an upset bonus</small></div><div className="val">1 + bonus</div></div>
    <table className="kt"><thead><tr><th>How big an underdog</th><th>Upset bonus</th></tr></thead><tbody>
      <tr><td>Near-even matchup</td><td>+0</td></tr><tr><td>Slight underdog</td><td>+1–3</td></tr><tr><td>Clear underdog</td><td>+4–6</td></tr>
      <tr><td>Big underdog</td><td>+7–11</td></tr><tr><td>Huge longshot</td><td>+12–15</td></tr></tbody></table>
    <div className="ex">Example: a team given a <b>~11% chance</b> beats a heavy favorite — you score <b>about 10 points</b>. Pick the favorite in a coin-flip game and you get the flat <b>1</b>.</div>
    <h2>Advancing to the Round of 32</h2>
    <div className="rule"><div className="lab">Each team you correctly send through<small>your 2 per group + 8 best third-place teams</small></div><div className="val">2</div></div>
    <h2>Knockout — per game</h2>
    <p>Same idea — <b>1 for calling the winner, plus an upset bonus</b> based on the odds — then <b>× the round multiplier</b>, so late-round shocks are worth the most.</p>
    <table className="kt"><thead><tr><th>Round</th><th>Multiplier</th></tr></thead><tbody>
      <tr><td>Round of 32</td><td>× 1</td></tr><tr><td>Round of 16</td><td>× 1.5</td></tr><tr><td>Quarterfinal</td><td>× 2</td></tr><tr><td>Semifinal</td><td>× 2.5</td></tr><tr><td>Final / champion</td><td>× 3</td></tr></tbody></table>
    <div className="ex"><b>Example:</b> you call a clear underdog to win a quarterfinal — say a +5 upset bonus. Base is 1 + 5 = 6, and the quarterfinal multiplier is ×2, so 6 × 2 = <b>12 points</b>. Pull off a longshot in the final and it's worth far more.</div>
    <p className="sub" style={{marginTop:16}}>Group picks lock June 11. The knockout opens after the groups, filled from the real 32 qualifiers — a wrong group call never wrecks your bracket.</p>
    <button className="homebtn" onClick={back}>← Back to home</button></div>);
}

/* Group picker */
function Side({team,rk,myProb,oppProb,side,selected,onPick,result}){
  const pts=potential(side,side==="A"?myProb:oppProb,side==="A"?oppProb:myProb);
  const upset=(Number(oppProb)-Number(myProb))>=BONUS_MIN_GAP;
  let extra="";if(result&&selected)extra=(result===side)?" correct":" wrong";
  return (<button className={"side"+(selected?" sel":"")+(upset?" upset":"")+extra} onClick={onPick} aria-pressed={selected}>
    <Crest team={team}/><div className="name">{team}</div><div className="rk">FIFA #{rk}</div><div className="pts"><b>+{pts}</b>{pts===1?"pt":"pts"}</div></button>);
}
function Match({g,pick,onPick}){
  const r=g.result;let earned=0,correct=false;if(r&&pick){correct=(pick===r);earned=correct?potential(pick,g.probA,g.probB):0;}
  return (<div className="match">
    <div className="meta"><span className="grp">GROUP {g.group}</span><span>{fmt(g.dateTimeISO)}{g.city?" · "+g.city:""}{g.country?", "+g.country:""}</span></div>
    <div className="rowg">

    {r&&<div className="res"><span className="ft">FT {g.scoreA}–{g.scoreB}</span>{pick?(correct?<span className="g"> · your pick +{earned}</span>:<span className="r"> · your pick 0</span>):<span> · no pick</span>}</div>}
    {!r&&(g.probA||g.probB)&&<div className="odds"><span>{g.teamA}: <b>{Math.round((g.probA||0)*100)}%</b></span><span>{g.teamB}: <b>{Math.round((g.probB||0)*100)}%</b></span></div>}</div>);

function Picker({user,fixtures,picks,setPicks,back}){
  const [L]=useState(locked());const [saved,setSaved]=useState(false);const [err,setErr]=useState("");const [busy,setBusy]=useState(false);
  const onPick=(id,v)=>{if(L)return;setSaved(false);setErr("");setPicks(p=>({...p,[id]:v}));};
  const made=Object.keys(picks).length,all=made===fixtures.length;
  async function save(){setErr("");setBusy(true);
    const attempt=async()=>{const res=await postJSON({action:"saveGroup",username:user,picksJson:JSON.stringify(picks)});
      if(res&&res.error)throw new Error(res.error);return res;};
    try{
      try{await attempt();}
      catch(e1){await new Promise(r=>setTimeout(r,1200));await attempt();}
      setSaved(true);
    }catch(e){setErr("Couldn't save");}
    setBusy(false);}
  const sorted=fixtures.slice().sort(byTime);
  const byDay={},dayOrder=[];sorted.forEach(f=>{const k=f.dateTimeISO?new Date(f.dateTimeISO).toDateString():"TBD";if(!byDay[k]){byDay[k]=[];dayOrder.push(k);}byDay[k].push(f);});

    {err&&<div className="err" style={{marginTop:12}}>{err}</div>}

    {dayOrder.map(k=>(<div key={k}><div className="ghead">{k==="TBD"?"DATE TBD":new Date(k).toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"})}</div>
      {byDay[k].map(f=><Match key={f.id} g={f} pick={picks[f.id]} onPick={onPick} />)}</div>))}
    <button className="homebtn" onClick={back}>← Back to home</button>
    {!L&&<div className="bar"><div className="inner" style={{flexDirection:"column",alignItems:"stretch",gap:8}}>
      {err&&<div className="err" style={{margin:0,textAlign:"center"}}>{err} — please try again.</div>}
      {saved&&!err&&<div className="ok" style={{margin:0,textAlign:"center"}}>Saved — {made}/72 in.{all?" All picked.":""}</div>}
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <span className="count"><b>{made}</b>/72</span>
        <button className="cta" style={{flex:1}} disabled={made===0||busy} onClick={save}>{busy?"Saving…":all?"Save all picks":`Save progress (${made})`}</button>
      </div></div></div>}</div>);
}

/* Standings + predicted bracket */
function StRow({pos,team,pts,cls,onUp,onDown,canUp,canDown}){
  return (<div className={"strow "+cls}><span className="pos">{pos}</span>
    <span className="nm"><Crest team={team}/>{team}<small>#{RANK[team]}</small></span><span className="pp">{pts}</span>
    <button className="mv" disabled={!canUp} onClick={onUp}>▲</button><button className="mv" disabled={!canDown} onClick={onDown}>▼</button></div>);
}
function Standings({user,fixtures,picks,saved,onSaved,back}){
  const made=Object.keys(picks).length;
  const groupFx=fixtures.filter(f=>(f.round||"GROUP")==="GROUP");
  // Fresh ordering computed from the CURRENT picks (points desc, FIFA rank as tiebreak).
  const freshOrders=()=>{const o={};Object.keys(GROUPS).forEach(g=>{o[g]=standings(GROUPS[g],groupFx,picks).order;});return o;};
  // Use the saved manual order ONLY if it was built from these same picks; otherwise re-seed from current picks.
  const savedMatchesPicks=saved&&saved.orders&&saved.picksSig!==undefined&&saved.picksSig===picksSig(picks);
  const init=savedMatchesPicks?saved.orders:freshOrders();
  const [orders,setOrders]=useState(init);
  const thirdsPool=Object.keys(GROUPS).map(g=>({team:orders[g][2],group:g})).filter(x=>x.team);
  const [thirds,setThirds]=useState(()=>saved&&saved.thirds?saved.thirds:thirdsPool.map(x=>x.team).sort((a,b)=>RANK[a]-RANK[b]).slice(0,8));
  const validThirds=thirds.filter(t=>thirdsPool.some(x=>x.team===t));
  const [showBr,setShowBr]=useState(!!savedMatchesPicks);const [msg,setMsg]=useState("");const [busy,setBusy]=useState(false);
  const realSet=actualR32(fixtures);const L=locked();
  function move(g,i,dir){if(L)return;setOrders(o=>{const arr=o[g].slice();const j=i+dir;if(j<0||j>3)return o;[arr[i],arr[j]]=[arr[j],arr[i]];return{...o,[g]:arr};});setShowBr(false);setMsg("");}
  function toggleThird(t){if(L)return;setThirds(ts=>{
    if(ts.includes(t))return ts.filter(x=>x!==t);
    const poolNames=thirdsPool.map(x=>x.team);
    const pruned=ts.filter(x=>poolNames.indexOf(x)!==-1); // drop teams no longer in 3rd after a reorder
    return pruned.length<8?[...pruned,t]:pruned;
  });setShowBr(false);setMsg("");}
  if(made<72) return (<div className="wrap"><button className="back" onClick={back}>← Home</button>
    <div className="eyebrow">Standings</div><h1 style={{fontSize:30}}>Almost there</h1>
    <div className="ok" style={{background:"rgba(232,163,61,.12)",borderColor:"var(--amber)",color:"#f3dcb0"}}>You've made {made}/72 group picks. Finish all 72 to generate your standings and predicted bracket.</div>
    <button className="homebtn" onClick={back}>← Back to home</button></div>);
  let games=null,bErr="";
  if(showBr){const chosen=validThirds.map(t=>({team:t,group:thirdsPool.find(x=>x.team===t).group}));
    if(chosen.length!==8)bErr="Pick exactly 8 third-place teams.";
    else{const assign=matchThirds(chosen);
      if(!assign)bErr="This set of third-place teams can't be slotted — swap one or two.";
      else{const W=g=>orders[g][0],RU=g=>orders[g][1];const ref=t=>{const p=t.split("-");return p[0]==="W"?W(p[1]):RU(p[1]);};
        games=FIXED_R32.map(([a,b])=>[ref(a),ref(b)]);THIRD_SLOTS.forEach(s=>{if(assign[s.w])games.push([W(s.w),assign[s.w].team]);});}}}
  async function generate(){setShowBr(true);if(L)return;
    const advancers=[];Object.keys(GROUPS).forEach(g=>{advancers.push(orders[g][0],orders[g][1]);});validThirds.forEach(t=>advancers.push(t));
    setBusy(true);setMsg("");try{const advObj={advancers,orders,thirds:validThirds,picksSig:picksSig(picks)};const res=await postJSON({action:"saveGroup",username:user,picksJson:JSON.stringify(picks),advanceJson:JSON.stringify(advObj)});
      if(res.error)setMsg(res.error);else{setMsg("Your bracket was saved.");if(onSaved)onSaved(advObj);}}catch(e){setMsg("Network error — bracket not saved.");}setBusy(false);}
  function share(){if(!games)return;const lines=games.map(([a,b],i)=>`${i+1}. ${a} (#${RANK[a]}) v ${b} (#${RANK[b]})`).join("\n");
    const text=`My World Cup 2026 predicted Round of 32:\n\n${lines}`;
    if(navigator.share){navigator.share({title:"My WC2026 bracket",text}).catch(()=>{});}
    else{try{navigator.clipboard.writeText(text);setMsg("Bracket copied — paste into WhatsApp, or screenshot it.");}catch(e){setMsg("Screenshot the bracket to share.");}}}
  const field=null; // predicted bracket uses games[] directly via PredBracket
  return (<div className="wrap"><button className="back" onClick={back}>← Home</button>
    <div className="eyebrow">From your picks</div><h1 style={{fontSize:30}}>Who advances to the Round of 32</h1>
    <p className="sub">{L?"Locked — tournament has started. View only.":"32 teams reach the Round of 32: the top 2 from each group (green), plus the 8 best third-place teams (amber). Your group picks set the points — 3 for a win, 1 for a draw. Use ▲▼ to break any ties, then pick your 8 third-place qualifiers below."}</p>
    {Object.keys(GROUPS).sort().map(g=>{const {pts}=standings(GROUPS[g],groupFx,picks);const ord=orders[g];
      return (<div key={g}><div className="ghead">GROUP {g}</div>
        {ord.map((t,i)=><StRow key={t} pos={i+1} team={t} pts={pts[t]} cls={i<2?"q":i===2?"third":"out"} onUp={()=>move(g,i,-1)} onDown={()=>move(g,i,1)} canUp={i>0&&!L} canDown={i<3&&!L} />)}</div>);})}
    <div className="ghead">PICK 8 OF 12 THIRD-PLACE TEAMS</div>
    <p className="sub" style={{marginBottom:8}}>{validThirds.length}/8 selected · FIFA ranks shown to help</p>
    <div>{thirdsPool.slice().sort((a,b)=>RANK[a.team]-RANK[b.team]).map(x=>(
      <span key={x.team} className={"chip"+(thirds.includes(x.team)?" sel":"")} onClick={()=>toggleThird(x.team)}><Crest team={x.team}/>{x.team} <small>#{RANK[x.team]}·{x.group}</small></span>))}</div>
    <div style={{margin:"18px 0"}}><button className="cta" style={{width:"100%"}} disabled={validThirds.length!==8||busy} onClick={generate}>{busy?"Saving…":validThirds.length!==8?`Pick ${8-validThirds.length} more`:L?"View my Round of 32":"Generate my Round of 32"}</button></div>
    {msg&&<div className="ok" style={{marginBottom:12}}>{msg}</div>}
    {showBr&&bErr&&<div className="err">{bErr}</div>}
    {showBr&&games&&(<div><div className="ghead">YOUR PREDICTED BRACKET</div>
      {realSet.size>0&&<p className="sub" style={{margin:"0 4px 8px"}}>Green = made the real Round of 32, red = didn't.</p>}
      <PredBracket games={games} realSet={realSet} />
      <button className="sharebtn" onClick={share}>Share my bracket</button>
      <button className="homebtn" onClick={back}>← Back to home</button></div>)}
  </div>);
}

/* Knockout bracket — only live once the real 32 qualifiers are in the sheet */
function koIdx(f){const m=String(f.id).match(/(\d+)\s*$/);return m?parseInt(m[1],10):9999;}
function buildKOField(fixtures){const r32=fixtures.filter(f=>f.round==="R32").sort((a,b)=>koIdx(a)-koIdx(b));
  const arr=[];r32.forEach(f=>{arr.push({team:f.teamA,seed:RANK[f.teamA]||99});arr.push({team:f.teamB,seed:RANK[f.teamB]||99});});return arr;}
function Knockout({user,fixtures,savedPk,bracketLocked,readOnly,back}){
  const real=fixtures.filter(f=>f.round==="R32").length===16;
  const [field]=useState(()=>buildKOField(fixtures));
  const [pk,setPk]=useState(savedPk||{});const [msg,setMsg]=useState("");const [busy,setBusy]=useState(false);
  const dead=eliminatedSet(fixtures);
  function pick(round,m,team){if(readOnly||bracketLocked)return;setPk(p=>{const r={...(p[round]||{})};r[m]=team;const np={...p,[round]:r};
    const ri=ROUND_SEQ.findIndex(x=>x[0]===round);for(let k=ri+1;k<ROUND_SEQ.length;k++)delete np[ROUND_SEQ[k][0]];return np;});setMsg("");}
  const champ=(pk.FINAL||{})[0];
  async function submit(){setBusy(true);setMsg("");try{const res=await postJSON({action:"saveBracket",username:user,picksJson:JSON.stringify(pk)});
    setMsg(res.error?res.error:"Your bracket was saved. It'll be here when you come back, editable until the knockout starts.");}catch(e){setMsg("Network error submitting.");}setBusy(false);}
  const colorFn=t=>dead.has(t)?"dead":"";
  if(!real) return (<div className="wrap"><button className="back" onClick={back}>← Home</button>
    <div className="eyebrow">Knockout</div><h1 style={{fontSize:30}}>Knockout bracket</h1>
    <div className="ok" style={{background:"rgba(232,163,61,.12)",borderColor:"var(--amber)",color:"#f3dcb0"}}>The knockout bracket opens once the group stage finishes and all 32 qualifiers are set (after June 27). Come back then to fill out your real Round of 32 through the final.</div>
    <button className="homebtn" onClick={back}>← Back to home</button></div>);
  return (<div className="wrap"><button className="back" onClick={back}>← Home</button>
    <div className="eyebrow">Knockout</div><h1 style={{fontSize:30}}>Knockout bracket</h1>
    <p className="sub">{readOnly?"View only.":bracketLocked?"Locked — knockout underway. ":"Tap a team to advance it; scroll sideways. "}Eliminated teams cross out red across your whole bracket.</p>
    <Bracket field={field} pk={pk} onPick={pick} colorFn={colorFn} interactive={!readOnly&&!bracketLocked} />
    {msg&&<div className="ok" style={{marginTop:10}}>{msg}</div>}

      <button className="cta" disabled={!champ||busy} onClick={submit}>{busy?"Saving…":champ?"Submit bracket":"Pick to the final"}</button></div></div>}
    {(readOnly||bracketLocked)&&<button className="homebtn" onClick={back}>← Back to home</button>}</div>);
}

/* Leaderboard */
function Leaderboard({user,back,bracketLocked,viewBracket}){
  const [rows,setRows]=useState(null);const [bp,setBp]=useState({});const [err,setErr]=useState("");
  useEffect(()=>{fetch(API_URL+"?action=bootstrap").then(r=>r.json()).then(d=>{
    if(d.error){setErr(d.error);return;}
    const scored={};(d.leaderboard||[]).forEach(r=>scored[r.username]=r);
    const all=(d.users||[]).map(u=>scored[u]||{username:u,total:0,groupPts:0,advancePts:0,bracketPts:0});
    (d.leaderboard||[]).forEach(r=>{if((d.users||[]).indexOf(r.username)===-1)all.push(r);}); // safety: include any scored user missing from Users
    setRows(ranksWithTies(all.sort((a,b)=>(b.total||0)-(a.total||0)||String(a.username).localeCompare(b.username))));}).catch(()=>setErr("Couldn't load."));
    fetch(API_URL+"?action=mypicks&username="+encodeURIComponent(user)).then(r=>r.json()).then(d=>{const m={};(d.allBracketPicks||[]).forEach(x=>m[x.username]=x.picksJson);setBp(m);}).catch(()=>{});
  },[]);

      <span className="rk">{r.place}</span>
      <span className="u">{r.username}{r.username===user?" (you)":""}<small>group {r.groupPts||0} · advance {r.advancePts||0} · bracket {r.bracketPts||0}{champ?" · champ: "+champ:""}</small></span>

    <button className="homebtn" onClick={back}>← Back to home</button></div>);

/* Live games */
function LiveGames({fixtures,allGroupPicks,leaderboard,back}){
  const live=fixtures.filter(isLive).sort(byTime);

    if(f.status==="FINISHED"||f.result)return false;

  const placeMap={};ranksWithTies((leaderboard||[]).slice().sort((a,b)=>(b.total||0)-(a.total||0))).forEach(r=>placeMap[r.username]=r.place);

/* App */

  const [bracketLocked,setBL]=useState(false);
  const [viewUser,setViewUser]=useState(null);const [viewUserPk,setViewUserPk]=useState(null);
  function load(){
    fetch(API_URL+"?action=bootstrap").then(r=>r.json()).then(d=>{
      if(d.teams){d.teams.forEach(t=>{if(t.crestUrl&&!CREST[t.team])CREST[t.team]=t.crestUrl;});}
      if(d.titleOdds){d.titleOdds.forEach(t=>{TITLE[t.team]=Number(t.titleProb);});}
      if(d.fixtures&&d.fixtures.length){const teams={};(d.teams||[]).forEach(t=>teams[t.team]=t);const odds={};(d.odds||[]).forEach(o=>odds[o.fixtureId]=o);
        setFixtures(d.fixtures.map(f=>({...f,seedA:Number((teams[f.teamA]||{}).seed)||RANK[f.teamA],seedB:Number((teams[f.teamB]||{}).seed)||RANK[f.teamB],probA:(odds[f.id]||{}).probA,probB:(odds[f.id]||{}).probB})));}
      setLeaderboard(d.leaderboard||[]);setBL(!!d.bracketLocked);
    }).catch(()=>{});
    fetch(API_URL+"?action=mypicks&username="+encodeURIComponent(user)).then(r=>r.json()).then(d=>{
      if(d.group&&d.group.picksJson)setPicks(JSON.parse(d.group.picksJson));
      if(d.group&&d.group.advanceJson){try{const a=JSON.parse(d.group.advanceJson);setAdvance(Array.isArray(a)?{advancers:a}:a);}catch(e){}}
      if(d.bracket&&d.bracket.picksJson){try{setBracketPk(JSON.parse(d.bracket.picksJson));}catch(e){}}
      setAllGroupPicks(d.allGroupPicks||[]);
    }).catch(()=>{});
  }
  useEffect(()=>{if(user)load();},[user]);
  if(!user)return <Auth onAuth={setUser} />;
  const gf=fixtures.filter(f=>(f.round||"GROUP")==="GROUP");
  const picksCount=Object.keys(picks).length;
  const hasStandings=!!(advance&&advance.advancers&&advance.advancers.length);
  // Stale = standings exist but weren't generated from the current picks.
  // A save with no stored signature (pre-signature save) can't be proven current, so treat it as stale.
  const standingsStale=hasStandings&&advance.picksSig!==picksSig(picks);
  const standingsDone=hasStandings&&!standingsStale;
  const champ=bracketPk&&(bracketPk.FINAL||{})[0];
  const koStatus=champ?"done":(bracketPk&&Object.keys(bracketPk).length?"resume":"open");
  const anyLive=fixtures.some(isLive);const koOpen=fixtures.filter(f=>f.round==="R32").length===16;const home=()=>{setView("home");setViewUser(null);};
  if(view==="scoring")return <HowScoring back={home} />;
  if(view==="group")return <Picker user={user} fixtures={gf} picks={picks} setPicks={setPicks} back={home} />;
  if(view==="standings")return <Standings user={user} fixtures={fixtures} picks={picks} saved={advance&&advance.orders?advance:null} onSaved={setAdvance} back={home} />;
  if(view==="ko"&&navPhase()>=3)return <Knockout user={user} fixtures={fixtures} savedPk={bracketPk} bracketLocked={bracketLocked} readOnly={false} back={home} />;
  if(view==="leaderboard"){
    if(viewUser)return <Knockout user={viewUser} fixtures={fixtures} savedPk={viewUserPk||{}} bracketLocked={true} readOnly={true} back={()=>setViewUser(null)} />;
    return <Leaderboard user={user} back={home} bracketLocked={bracketLocked} viewBracket={(u)=>{
      fetch(API_URL+"?action=mypicks&username="+encodeURIComponent(u)).then(r=>r.json()).then(d=>{
        try{setViewUserPk(d.bracket&&d.bracket.picksJson?JSON.parse(d.bracket.picksJson):{});}catch(e){setViewUserPk({});}setViewUser(u);});}} />;
  }
  if(view==="live")return <LiveGames fixtures={fixtures} allGroupPicks={allGroupPicks} leaderboard={leaderboard} back={home} />;
  return <Home user={user} go={setView} picksCount={picksCount} standingsDone={standingsDone} standingsStale={standingsStale} koStatus={koStatus} koOpen={koOpen} anyLive={anyLive} phase={navPhase()}
    onSignOut={()=>{if(typeof localStorage!=="undefined")localStorage.removeItem("wc_user");setUser(null);setPicks({});setAdvance(null);setBracketPk(null);}} />;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
